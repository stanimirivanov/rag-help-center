spring:
  application:
    name: embedding-worker
  flyway:
    table: embedding_flyway_schema_history
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
    ollama:
      embedding:
        options:
          model: nomic-embed-text
app:
  embedding:
    provider: ollama
  kafka:
    listener:
      enabled: true
    article-events-dlt: help-center.article-events.v1.DLT
server:
  port: 8082
